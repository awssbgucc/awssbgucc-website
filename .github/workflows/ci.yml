# Runs every check on each push to main and each pull request into it.
# Databases are throwaway Postgres service containers on the runner, never Neon. No secrets are used:
# the values below are placeholders that only let the app build and sign test sessions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Types, lint, copy and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database:
    name: Database tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sbg_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sbg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:deploy
      - name: Check the schema matches the migrations
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Runs on an empty database, before any seed, so the admin race test has no other admins to hide behind.
      - name: Database and race tests
        run: pnpm test:int

  build-and-e2e:
    name: Production build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbg_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sbg_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sbg_e2e
      AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-else
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3211
      S3_BUCKET: ci-placeholder
      S3_REGION: eu-west-1
      S3_PUBLIC_BASE_URL: https://ci-placeholder.s3.eu-west-1.amazonaws.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database with the seed, the development fixtures and the reviewed event history
        run: |
          pnpm db:deploy
          pnpm db:seed
          pnpm db:fixtures
          pnpm exec tsx scripts/import-community-history.ts --apply --preview
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The production config builds the app, starts it and runs the shared flows plus the production-only checks.
      # The dev-server run (styleguide pages) stays local: it adds little and doubles the time.
      - name: Build and run end-to-end tests
        run: pnpm exec playwright test -c playwright.prod.config.ts
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
